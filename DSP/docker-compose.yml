services:
  postgres:
    image: postgres:16-alpine
    container_name: itsm-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: your_itsm_database
      POSTGRES_USER: your_postgres_username
      POSTGRES_PASSWORD: your_postgres_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U your_postgres_username -d your_itsm_database"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
