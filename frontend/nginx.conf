server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  location /api/ {
    # Docker's embedded DNS; re-resolves "backend" so a rebuilt/recreated
    # backend container does not leave nginx pointing at a stale IP.
    resolver 127.0.0.11 valid=10s;
    set $backend_upstream http://backend:8080;
    proxy_pass $backend_upstream;      # no URI part: /api/... is forwarded unchanged
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location / {
    try_files $uri /index.html;        # React Router client-side routes
  }
}
